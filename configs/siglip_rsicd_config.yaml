# SigLIP Fine-Tuning on RSICD (Remote Sensing Domain)

model:
  name: "siglip"
  pretrained_model: "google/siglip-base-patch16-224"
  load_pretrained: true
  freeze_backbone: false

  text_config:
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 12
    intermediate_size: 3072
    max_position_embeddings: 64
    vocab_size: 32000
    projection_size: 768

  vision_config:
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 12
    intermediate_size: 3072
    image_size: 224
    patch_size: 16
    projection_size: 768

training:
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 500
  max_epochs: 10
  gradient_clip_norm: 1.0
  optimizer: "adamw"
  scheduler: "cosine"
  loss_type: "siglip_binary"

data:
  dataset: "rsicd"
  data_root: "./data/rsicd"
  num_workers: 8
  pin_memory: true
  max_samples: null
  image_size: 224
  augmentation: true
  max_text_length: 64
  truncation: true
  padding: "max_length"
  use_regression_targets: false
  generate_similarities_online: false

evaluation:
  eval_every_n_epochs: 1
  save_best_model: true
  metrics:
    - "zero_shot_classification"

logging:
  use_wandb: false
  use_tensorboard: true
  project_name: "siglip_vs_reglip"
  experiment_name: "siglip_rsicd"
  log_every_n_steps: 50

checkpointing:
  save_every_n_epochs: 1
  checkpoint_dir: "./checkpoints/siglip_rsicd"
  keep_last_n_checkpoints: null

device: "cuda"
mixed_precision: true
distributed: false
